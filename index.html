<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css"> <!--To connect CSS with HTML-->
</head>

<body>

    <h1>Rock Paper Scissors</h1>

    <div class="theme">
        <button class="btn-theme">Dark 🌙</button>
    </div>
    

    <div class="choices">
        <div class="choice" id="rock" title="Rock">
            <img src="images/rock.png" alt="rock">
        </div>

        <div class="choice" id="paper">

            <img src="images/paper.png" alt="paper" title="Paper">
        </div>

        <div class="choice" id="scissors">
            <img src="images/scissors.png" alt="scissors" title="Scissor">
        </div>
    </div>

    <div class="score-card">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>

        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>

    <div class="message">
        <p id="pick-move">Pick your move</p>
    </div>

    <audio id="win-sound" src="sounds/winSound.mp3"></audio>
    <audio id="lose-sound" src="sounds/loseSound.mp3"></audio>
    <audio id="draw-sound" src="sounds/drawSound.mp3"></audio>

    <script src="app.js"></script> <!--To connect JS with HTML-->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</body>
</html>
